<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0B1728" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#030711" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="orbitModis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DA3FF" />
      <stop offset="100%" stop-color="#4DA3FF" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="orbitViirs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A2A" />
      <stop offset="100%" stop-color="#FF6A2A" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Deep space background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle instrument coordinate graticule -->
  <g opacity="0.12" stroke="#91A0B5" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="550" x2="1200" y2="550" />
    <circle cx="600" cy="315" r="280" stroke-dasharray="4 6" />
    <circle cx="600" cy="315" r="420" stroke-dasharray="2 8" />
  </g>

  <!-- Central Card Container -->
  <rect x="120" y="75" width="960" height="480" rx="8" fill="#07111F" stroke="rgba(145, 160, 181, 0.2)" stroke-width="1" />

  <!-- Top Metadata Header -->
  <g font-family="'DM Mono', monospace" font-size="12" fill="#91A0B5" letter-spacing="2">
    <text x="160" y="125">MISSION INSTRUMENT · WGS 84 / GEOID</text>
    <text x="820" y="125" text-anchor="start">SPACE APPS 2026</text>
  </g>

  <!-- Mark Section (Thin circle Earth crossed by two offset orbit arcs) -->
  <g transform="translate(160, 160)">
    <!-- Thin circle (Earth) -->
    <circle cx="50" cy="50" r="38" stroke="rgba(145, 160, 181, 0.45)" stroke-width="1.5" fill="#030711" />
    <circle cx="50" cy="50" r="14" fill="#F4F7FA" opacity="0.9" />

    <!-- MODIS orbit arc (data-blue) -->
    <ellipse cx="50" cy="50" rx="46" ry="19" transform="rotate(-32 50 50)" stroke="#4DA3FF" stroke-width="2.5" stroke-dasharray="4 3" fill="none" />

    <!-- VIIRS orbit arc (thermal-orange) -->
    <ellipse cx="50" cy="50" rx="46" ry="19" transform="rotate(32 50 50)" stroke="#FF6A2A" stroke-width="2.5" fill="none" />

    <!-- Agreement node (agreement-teal dot where they intersect) -->
    <circle cx="82" cy="36" r="5" fill="#56D6C9" />
    <circle cx="82" cy="36" r="9" stroke="#56D6C9" stroke-width="1" opacity="0.6" />
  </g>

  <!-- Brand Typography -->
  <!-- Wordmark in Space Grotesk with wide letter-spacing -->
  <text x="290" y="210" font-family="'Space Grotesk', system-ui, sans-serif" font-size="52" font-weight="700" fill="#F4F7FA" letter-spacing="8">TERRAFLUX</text>
  
  <!-- Sub-label in DM Mono -->
  <text x="294" y="242" font-family="'DM Mono', monospace" font-size="13" font-weight="500" fill="#91A0B5" letter-spacing="3">EARTH OBSERVATION / FIRE ACTIVITY</text>

  <!-- Tagline -->
  <text x="160" y="340" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="600" fill="#F4F7FA" letter-spacing="-0.5">
    Earth's thermal story, harmonized.
  </text>

  <!-- Description paragraph -->
  <text x="160" y="390" font-family="'Inter', system-ui, sans-serif" font-size="18" fill="#91A0B5">
    Explore harmonized MODIS and VIIRS active-fire observations from NASA FIRMS
  </text>
  <text x="160" y="420" font-family="'Inter', system-ui, sans-serif" font-size="18" fill="#91A0B5">
    through a common analytical framework.
  </text>

  <!-- Footer badges -->
  <g transform="translate(160, 480)" font-family="'DM Mono', monospace" font-size="11" letter-spacing="1.5">
    <rect x="0" y="0" width="180" height="28" rx="4" fill="#0B1728" stroke="rgba(145, 160, 181, 0.2)" stroke-width="1" />
    <text x="14" y="18" fill="#4DA3FF">MODIS · 1,000 M</text>

    <rect x="195" y="0" width="170" height="28" rx="4" fill="#0B1728" stroke="rgba(145, 160, 181, 0.2)" stroke-width="1" />
    <text x="210" y="18" fill="#FF6A2A">VIIRS · 375 M</text>

    <rect x="380" y="0" width="180" height="28" rx="4" fill="#0B1728" stroke="rgba(145, 160, 181, 0.2)" stroke-width="1" />
    <text x="395" y="18" fill="#56D6C9">CROSS-AGREEMENT</text>

    <text x="590" y="18" fill="#91A0B5">DATA SOURCE: NASA FIRMS</text>
  </g>
</svg>
